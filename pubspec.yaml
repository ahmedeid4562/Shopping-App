name: shopping_app
description: "A new Flutter project."

# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade the package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.6
  equatable: ^3.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_android: 2.5.4

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # Assets used in the application.
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific variants.
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies:
  # https://flutter.dev/to/asset-from-package